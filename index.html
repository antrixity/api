<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>AntrixStats · DonutSMP</title>

<style>
/* Place "SF Pro Display Bold.ttf" in the same folder as this file */
@font-face{
  font-family:"SF Pro Display";
  src:url("SF%20Pro%20Display%20Bold.ttf") format("truetype");
  font-weight:700;
  font-style:normal;
  font-display:swap;
}

:root{
  --accent:#0066ff;
  --accent2:#00a2ff;
  --glow:rgba(0,102,255,.14);
  --bg:#050505;
  --panel:rgba(255,255,255,.03);
  --line:rgba(255,255,255,.07);
  --muted:#8f8f94;
  --font:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

html{-webkit-text-size-adjust:100%}

body{
  font-family:var(--font);
  font-weight:700;
  font-synthesis:none;
  background:var(--bg);
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

.hero{
  min-height:100vh;
  padding:34px clamp(18px,4vw,46px) 70px;
  background:
    radial-gradient(circle at 12% 0%,var(--glow),transparent 42%),
    radial-gradient(circle at 88% 8%,var(--glow),transparent 46%),
    linear-gradient(160deg,#0b0b0c 0%,#050505 65%);
}

.wrap{max-width:1240px;margin:0 auto}

/* header */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:34px;
}
.server{display:flex;align-items:center;gap:12px}
.server img{width:32px;height:32px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.server span{font-size:20px}
.brand{
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent2);opacity:.6;user-select:none;
}

/* hero */
.top{display:flex;align-items:center;gap:clamp(24px,5vw,56px)}
.skin{
  width:clamp(150px,22vw,270px);flex-shrink:0;
  filter:drop-shadow(0 0 40px rgba(255,255,255,.08));
  animation:float 5s ease-in-out infinite;
}
@keyframes float{50%{transform:translateY(-8px)}}

.left{flex:1;min-width:0}

.name{
  font-size:clamp(38px,8vw,72px);
  line-height:1.08;letter-spacing:-.05em;
  margin-bottom:24px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:rgba(255,255,255,.88);
}
.name.idle{animation:idle 3.4s ease-in-out infinite}
@keyframes idle{
  0%,100%{opacity:.35;filter:blur(8px)}
  25%,70%{opacity:1;filter:blur(0)}
}
.name.shine{
  background:linear-gradient(110deg,rgba(255,255,255,.82) 40%,#fff 50%,rgba(255,255,255,.82) 60%) 130% 0/300% 100% no-repeat;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:sweep .8s ease-out both;
}
@keyframes sweep{to{background-position:-60% 0}}

/* search */
.search{display:flex;gap:12px;max-width:760px}
.field{position:relative;flex:1;min-width:0}
.field svg{
  position:absolute;left:22px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;opacity:.55;pointer-events:none;
}
.field input{
  width:100%;height:68px;padding:0 22px 0 58px;
  font:inherit;font-size:18px;color:#fff;outline:none;
  background:var(--panel);
  border:1px solid var(--line);border-radius:12px;
  transition:border-color .2s,box-shadow .2s;
}
.field input::placeholder{color:var(--muted)}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}

.btn{
  position:relative;overflow:hidden;
  height:68px;padding:0 34px;
  font:inherit;font-size:17px;color:#fff;cursor:pointer;
  border:0;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  transition:transform .2s,opacity .2s;
}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:disabled{opacity:.55;cursor:wait}
.btn:focus-visible,.field input:focus-visible{outline:2px solid #fff;outline-offset:2px}

.status{min-height:24px;margin-top:16px;font-size:15px;color:var(--muted)}
.status.error{color:#ff6d6d}

/* stats */
.stats{
  display:grid;gap:16px;margin-top:40px;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
}
.card{
  padding:22px 24px;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015));
  border:1px solid var(--line);border-radius:14px;
  transition:transform .2s,border-color .2s;
  animation:rise .4s ease both;
}
.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.14)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

.label{
  display:flex;align-items:center;gap:10px;
  font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  margin-bottom:14px;
}
.label img{width:24px;height:24px;object-fit:contain;image-rendering:pixelated}
.value{font-size:clamp(30px,4vw,40px);letter-spacing:-.03em;line-height:1.1}

.money{color:#e8bc42}.shards{color:#9f72ff}.playtime{color:#589cff}
.kills{color:#ff6d6d}.deaths{color:#d7d7d7}.placed{color:#50e791}
.broken{color:#e28a46}.mobs{color:#47dfaa}.kd{color:#ffd76a}

.foot{margin-top:60px;text-align:center;font-size:12px;color:#55555a}

@media (max-width:760px){
  .top{flex-direction:column;align-items:stretch;gap:20px;text-align:center}
  .skin{width:150px;margin:0 auto}
  .search{flex-direction:column}
  .field input,.btn{height:60px}
  .name{margin-bottom:18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<body>
<main class="hero">
<div class="wrap">

  <header class="topbar">
    <div class="server">
      <img src="https://website.donutsmp.org/bcGCsev.png" alt="" onerror="this.style.display='none'">
      <span>DonutSMP</span>
    </div>
    <div class="brand">AntrixStats</div>
  </header>

  <section class="top">
    <img id="skin" class="skin" src="https://vzge.me/bust/lovehutao1.png?autocrop" alt="Player skin">

    <div class="left">
      <h1 id="playerName" class="name idle">DonutSMP</h1>

      <form class="search" id="searchForm" autocomplete="off">
        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="username" type="text" maxlength="16" spellcheck="false"
                 placeholder="Search Minecraft username..." aria-label="Minecraft username">
        </div>
        <button class="btn" id="searchBtn" type="submit">Search</button>
      </form>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </div>
  </section>

  <section id="stats" class="stats"></section>

  <p class="foot">Not affiliated with Mojang or DonutSMP.</p>
</div>
</main>

<script>
const ICONS={
  money:'https://ccvaults.com/assets/10.%20Items/11.%20Materials/Emerald.png',
  shards:'https://ccvaults.com/assets/10.%20Items/21.%20Decoration/Amethyst_Shard.png',
  playtime:'https://minecraft.wiki/images/Compass_JE3_BE3.gif?0043f&format=original',
  kills:'https://minecraft.wiki/images/Enchanted_Diamond_Sword.gif?f741f&format=original',
  deaths:'https://ccvaults.com/assets/80.%20Particles/raid_omen.png',
  placed:'https://ccvaults.com/assets/20.%20Blocks/18.%20Decoration/Grass_Block.png',
  broken:'https://minecraft.wiki/images/Enchanted_Diamond_Pickaxe.gif?c7aaa&format=original',
  mobs:'https://ccvaults.com/assets/80.%20Particles/trial_omen.png',
  kd:'https://minecraft.wiki/images/Enchanted_Netherite_Sword.gif?a1a02&format=original'
};

const $=id=>document.getElementById(id);
const nameEl=$('playerName'), statusEl=$('status'), statsEl=$('stats'),
      skinEl=$('skin'), btn=$('searchBtn'), input=$('username');

let requestId=0;

/* ---------- formatting ---------- */
function shorten(v){
  const n=parseFloat(String(v??'').replace(/,/g,''));
  if(!isFinite(n)) return '0';
  const a=Math.abs(n);
  const units=[[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']];
  for(const [size,suffix] of units){
    if(a>=size) return (n/size).toFixed(1).replace(/\.0$/,'')+suffix;
  }
  return String(Math.round(n*100)/100);
}
const money=v=>'$'+shorten(v);

function kd(kills,deaths){
  const k=parseFloat(String(kills??0).replace(/,/g,''))||0;
  const d=parseFloat(String(deaths??0).replace(/,/g,''))||0;
  return d?(k/d).toFixed(2):String(k);
}

function playtime(ms){
  const t=Math.floor(Number(ms)/1000);
  if(!isFinite(t)||t<=0) return '0m';
  const d=Math.floor(t/86400), h=Math.floor(t%86400/3600), m=Math.floor(t%3600/60);
  return d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m`;
}

/* ---------- ui helpers ---------- */
function setStatus(text,isError){
  statusEl.textContent=text||'';
  statusEl.classList.toggle('error',!!isError);
}

function setBusy(busy){
  btn.disabled=busy;
  btn.textContent=busy?'Loading...':'Search';
}

function showName(text){
  nameEl.textContent=text;
  nameEl.classList.remove('idle','shine');
  void nameEl.offsetWidth;
  nameEl.classList.add('shine');
}

function resetName(){
  nameEl.textContent='DonutSMP';
  nameEl.classList.remove('shine');
  nameEl.classList.add('idle');
}

function renderCards(s){
  const cards=[
    ['money','Money',money(s.money),'money'],
    ['shards','Shards',shorten(s.shards),'shards'],
    ['playtime','Playtime',playtime(s.playtime),'playtime'],
    ['kills','Kills',shorten(s.kills),'kills'],
    ['deaths','Deaths',shorten(s.deaths),'deaths'],
    ['placed','Blocks Placed',shorten(s.placed_blocks),'placed'],
    ['broken','Blocks Broken',shorten(s.broken_blocks),'broken'],
    ['mobs','Mobs Killed',shorten(s.mobs_killed),'mobs'],
    ['kd','K/D',kd(s.kills,s.deaths),'kd']
  ];
  statsEl.innerHTML=cards.map(([icon,label,value,cls],i)=>
    `<div class="card" style="animation-delay:${i*40}ms">
       <div class="label ${cls}"><img src="${ICONS[icon]}" alt="" loading="lazy" onerror="this.style.display='none'">${label}</div>
       <div class="value ${cls}">${value}</div>
     </div>`).join('');
}

/* ---------- data ---------- */
function parseStats(page){
  let doc;
  try{ doc=new DOMParser().parseFromString(page,'text/html'); }catch(e){ return null; }
  const blocks=doc.querySelectorAll('script[type="application/ld+json"]');
  for(const block of blocks){
    let json;
    try{ json=JSON.parse(block.textContent); }catch(e){ continue; }
    const graph=Array.isArray(json['@graph'])?json['@graph']:[json];
    for(const node of graph){
      const props=node&&node.mainEntity&&node.mainEntity.additionalProperty;
      if(!Array.isArray(props)||!props.length) continue;
      const out={};
      for(const p of props){ if(p&&p.name) out[p.name]=p.value; }
      if(Object.keys(out).length) return out;
    }
  }
  return null;
}

async function search(){
  const username=input.value.trim();

  if(!username){ setStatus('Enter a username.',true); return; }
  if(!/^[A-Za-z0-9_.]{1,16}$/.test(username)){
    setStatus('Usernames can only use letters, numbers, "_" and ".".',true);
    return;
  }

  const id=++requestId;
  statsEl.innerHTML='';
  setStatus('Loading stats...');
  setBusy(true);

  try{
    const target='https://www.donutstats.net/player/'+encodeURIComponent(username)+'?ref=player-stats';
    const res=await fetch('https://r.jina.ai/'+target,{headers:{'x-respond-with':'html'}});
    if(id!==requestId) return;                 // a newer search replaced this one
    if(!res.ok) throw new Error('HTTP '+res.status);

    const stats=parseStats(await res.text());
    if(id!==requestId) return;

    if(!stats){ setStatus('No DonutSMP stats found for that player.',true); return; }

    setStatus('');
    showName(username);
    skinEl.src='https://vzge.me/bust/'+encodeURIComponent(username)+'.png?autocrop';
    renderCards(stats);
  }catch(err){
    if(id!==requestId) return;
    console.error(err);
    setStatus('Could not reach the stats source. Please try again.',true);
  }finally{
    if(id===requestId) setBusy(false);
  }
}

skinEl.addEventListener('error',()=>{ skinEl.src='https://vzge.me/bust/steve.png?autocrop'; },{once:true});

$('searchForm').addEventListener('submit',e=>{ e.preventDefault(); search(); });
input.addEventListener('input',()=>{ if(!input.value.trim()&&!statsEl.children.length) resetName(); });
</script>
</body>
</html>
